<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>회원가입</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
<div class="wrap">
    <header>
        <div class="titlebox"><h1>인프밍 영화 정보 사이트입니다.</h1></div>
        <nav>
            <a href="index.html">메인페이지</a>
            <a href="login.html">로그인</a>
            <a href="signup.html" class="active">회원가입</a>
        </nav>
    </header>

    <main class="form-page">
        <form>
            <h2>Sign Up</h2>
            <label for="signup-name">Name</label>
            <input id="signup-name" type="text" name="name">
            <label for="signup-id">ID</label>
            <input id="signup-id" type="text" name="id">
            <label for="signup-email">Email</label>
            <input id="signup-email" type="email" name="email">
            <label for="signup-password">Password</label>
            <input id="signup-password" type="password" name="password">
            <input type="submit" value="Sign Up">
            <input type="reset" value="Reset">
        </form>
    </main>
</div>
</body>
</html>
